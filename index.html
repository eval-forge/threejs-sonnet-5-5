<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Orbital Relic</title>
<meta name="theme-color" content="#02040b">
<meta name="description" content="A procedurally generated relic from a lost civilization, orbited by six living worlds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#f3cf8a;--cyan:#7fe9ff;--ink:#02040b;--dim:rgba(190,225,255,.55);--font:'Josefin Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);overflow:hidden;font-family:var(--font);color:#cfefff;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}

/* loader */
#loader{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%,#07132b 0%,#02040b 70%);transition:opacity 1.6s ease,visibility 1.6s}
#loader.gone{opacity:0;visibility:hidden;pointer-events:none}
#loader .lw{width:min(360px,80vw);text-align:center}
.sigil{width:84px;height:84px;margin:0 auto 30px;display:block;overflow:visible}
.sigil g{transform-origin:50px 50px}
.sigil .a{animation:spin 14s linear infinite}
.sigil .b{animation:spin 9s linear infinite reverse}
.sigil .c{animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader h2{font-weight:300;font-size:15px;letter-spacing:.7em;text-indent:.7em;color:var(--gold);text-transform:uppercase}
.bar{height:1px;margin:26px 0 12px;background:rgba(127,233,255,.16);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,transparent,var(--cyan),var(--gold));box-shadow:0 0 12px var(--cyan);transition:width .35s ease}
.meta{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}

/* hud */
.hud{position:fixed;z-index:5;pointer-events:none;opacity:0;transition:opacity 2.4s ease .4s}
body.ready .hud{opacity:1}
#brand{top:max(20px,env(safe-area-inset-top));left:max(22px,env(safe-area-inset-left))}
#brand h1{font-weight:300;font-size:clamp(14px,1.8vw,19px);letter-spacing:.6em;color:var(--gold);text-transform:uppercase}
#brand p{margin-top:9px;font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
#hint{text-shadow:0 0 8px #02040b,0 0 3px #02040b;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 52px);left:0;right:0;text-align:center;font-size:10.5px;letter-spacing:.26em;color:var(--dim);text-transform:uppercase;padding:0 16px;transition:opacity 1.2s ease}
#hint.faded{opacity:.28}
#dock{bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto}
button.chip{font:inherit;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#bfeaff;background:rgba(6,20,44,.55);border:1px solid rgba(127,233,255,.28);padding:9px 15px;border-radius:2px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .25s,border-color .25s,color .25s}
button.chip:hover{background:rgba(20,60,96,.6);border-color:var(--cyan);color:#fff}
button.chip.on{border-color:var(--gold);color:var(--gold)}
#tip{position:fixed;z-index:9;pointer-events:none;opacity:0;transform:translate(14px,14px);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#e9fbff;background:rgba(3,12,28,.72);border:1px solid rgba(127,233,255,.35);padding:6px 10px;white-space:nowrap;transition:opacity .2s}
#tip.on{opacity:1}
#banner{position:fixed;z-index:8;left:0;right:0;top:38%;text-align:center;pointer-events:none;opacity:0;font-weight:300;font-size:clamp(20px,4.2vw,46px);letter-spacing:.9em;text-indent:.9em;color:#fff3d6;text-shadow:0 0 30px rgba(255,200,110,.75),0 0 80px rgba(127,233,255,.5);text-transform:uppercase;transition:opacity 1.4s ease,letter-spacing 4s ease}
#banner.on{opacity:1;letter-spacing:1.1em}
#toast{position:fixed;z-index:8;top:max(20px,env(safe-area-inset-top));right:max(22px,env(safe-area-inset-right));pointer-events:none;opacity:0;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);transition:opacity .5s}
#toast.on{opacity:1}
#veil{position:fixed;inset:0;z-index:40;background:#02040b;opacity:0;pointer-events:none;transition:opacity .65s ease}
#veil.on{opacity:1}
#fatal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:13px;letter-spacing:.2em;color:var(--gold);background:var(--ink)}
@media (max-width:640px){#hint{font-size:9px;letter-spacing:.16em}button.chip{padding:9px 11px;font-size:9.5px;letter-spacing:.16em}}
</style>

<div id="stage"></div>

<div id="loader">
  <div class="lw">
    <svg class="sigil" viewBox="0 0 100 100" fill="none" stroke-linecap="round">
      <g class="a"><circle cx="50" cy="50" r="46" stroke="#f3cf8a" stroke-opacity=".7" stroke-width="1" stroke-dasharray="3 9"/></g>
      <g class="b"><circle cx="50" cy="50" r="34" stroke="#7fe9ff" stroke-opacity=".8" stroke-width="1" stroke-dasharray="40 14"/></g>
      <g class="c"><polygon points="50,24 72,62 28,62" stroke="#f3cf8a" stroke-opacity=".9" stroke-width="1"/></g>

  </div>

  <button class="chip" id="bFreeze" type="button">Freeze time</button>

</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {mergeGeometries, mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';

/* ====================================================================
   Utilities
   ==================================================================== */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const E = {
  lin: t => t,
  out3: t => 1 - Math.pow(1 - t, 3),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
};
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const tick = () => new Promise(r => { let d = false; const f = () => { if (!d) { d = true; r(); } }; requestAnimationFrame(f); setTimeout(f, 60); });

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Seeded improved-Perlin noise (3D) with an fbm helper
function makeNoise(seed) {
  const rnd = mulberry32(seed);
  const perm = Array.from({length: 256}, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const p = new Uint8Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, y, z) => {
    h &= 15;
    const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  };
  function noise(x, y, z) {
    const fx = Math.floor(x), fy = Math.floor(y), fz = Math.floor(z);
    const X = fx & 255, Y = fy & 255, Z = fz & 255;
    x -= fx; y -= fy; z -= fz;
    const u = fade(x), v = fade(y), w = fade(z);
    const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
    return lerp(
      lerp(lerp(grad(p[AA], x, y, z), grad(p[BA], x - 1, y, z), u), lerp(grad(p[AB], x, y - 1, z), grad(p[BB], x - 1, y - 1, z), u), v),
      lerp(lerp(grad(p[AA + 1], x, y, z - 1), grad(p[BA + 1], x - 1, y, z - 1), u), lerp(grad(p[AB + 1], x, y - 1, z - 1), grad(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
  }
  noise.fbm = (x, y, z, oct = 4) => {
    let a = .5, f = 1, s = 0;
    for (let i = 0; i < oct; i++) { s += a * noise(x * f, y * f, z * f); f *= 2.03; a *= .5; }
    return s;
  };
  return noise;
}

const GLSL_NOISE = `
float hash13(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
float vnoise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vnoise(p);p=p*2.02+vec3(1.7,9.2,3.1);a*=.5;}return s;}
`;

/* ====================================================================
   Environment / device
   ==================================================================== */
const isTouch = matchMedia('(pointer:coarse)').matches;
const LOW = isTouch || Math.min(screen.width, screen.height) < 700;
const Q = {
  stars: LOW ? 3500 : 7500, dust: LOW ? 1300 : 3400, sparks: LOW ? 240 : 560,
  shadow: LOW ? 1024 : 2048, burst: LOW ? 2600 : 6000
};

let renderer;
try {
  renderer = new THREE.WebGLRenderer({antialias: false, powerPreference: 'high-performance', stencil: false});
} catch (err) {
  const f = $('fatal'); f.style.display = 'flex'; f.textContent = 'This artifact needs WebGL, which your browser refuses to provide.';
  throw err;
}
let pixelRatio = Math.min(window.devicePixelRatio || 1, LOW ? 1.75 : 2);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('stage').appendChild(renderer.domElement);
const canvas = renderer.domElement;
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040b);
scene.fog = new THREE.FogExp2(0x030816, 0.0065);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 4000);
const HOME_DIR = new THREE.Vector3(.10, .34, .94).normalize();
const homeDist = () => { const a = innerWidth / innerHeight; return a >= 1 ? 34 : clamp(38 / a, 34, 84); };

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.rotateSpeed = .55;
controls.zoomSpeed = .75;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 130;
controls.minPolarAngle = .12;
controls.maxPolarAngle = Math.PI - .12;

// Shared uniforms (same objects referenced by many materials)
const U = {
  uTime: {value: 0}, uCharge: {value: 0}, uPR: {value: pixelRatio}, uIntro: {value: 0}
};

const state = {
  t: 0, timeScale: 1, frozen: false, charge: 0, poke: 0, assemble: 0,
  lastInput: performance.now(), idleAmt: 0
};
const fx = {expand: 0, pulse: 0, flash: 0, push: 0, pull: 0};

/* ====================================================================
   Tween helper
   ==================================================================== */
const tweens = [];
function tween(dur, fn, o = {}) {
  const tw = {t: -(o.delay || 0), dur, fn, ease: o.ease || E.inOut, done: o.done, key: o.key, dead: false};
  tweens.push(tw);
  return tw;
}
function cancelTween(key) { for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].key === key) tweens.splice(i, 1); }
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt;
    if (tw.t < 0) continue;
    const k = clamp(tw.t / tw.dur, 0, 1);
    tw.fn(tw.ease(k), k);
    if (k >= 1) { tweens.splice(i, 1); if (tw.done) tw.done(); }
  }
}

/* ====================================================================
   Canvas texture helpers
   ==================================================================== */
function canvasTex(c, srgb = true) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}
function radialTex(size, stops) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([p, col]) => gr.addColorStop(p, col));
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return canvasTex(c);
}
function disposeTree(root) {
  root.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    const ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (const m of ms) {
      for (const k in m) { const v = m[k]; if (v && v.isTexture) v.dispose(); }
      m.dispose();
    }
    if (o.isInstancedMesh) o.dispose();
  });
}

/* ====================================================================
   Environment map (procedural studio of light panels, baked with PMREM)
   ==================================================================== */
function buildEnvironment() {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.SphereGeometry(60, 24, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    vertexShader: 'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: 'varying vec3 vP;void main(){float h=normalize(vP).y;vec3 top=vec3(.03,.07,.18);vec3 mid=vec3(.008,.016,.05);vec3 low=vec3(.03,.022,.016);vec3 c=mix(mid,top,smoothstep(0.,1.,h));c=mix(c,low,smoothstep(0.,-1.,h));gl_FragColor=vec4(c,1.);}'
  })));
  const panel = (hex, k, pos, w, h) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({color: new THREE.Color(hex).multiplyScalar(k), side: THREE.DoubleSide}));
    m.position.set(...pos); m.lookAt(0, 0, 0); s.add(m);
  };
  panel(0xffd9a0, 14, [12, 16, 8], 16, 7);
  panel(0x66e6ff, 9, [-16, 5, -9], 12, 12);
  panel(0x4a63ff, 6, [2, -12, 14], 18, 5);
  panel(0xfff2dc, 5, [0, 30, -2], 22, 22);
  panel(0x7dffe8, 4, [16, -2, -14], 8, 14);
  const pm = new THREE.PMREMGenerator(renderer);
  const rt = pm.fromScene(s, .035);
  pm.dispose();
  disposeTree(s);
  return rt;
}

/* ====================================================================
   Background: nebula, stars, dust, sparks
   ==================================================================== */
function buildNebula() {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1500, 48, 32), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {uTime: U.uTime},
    vertexShader: 'varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: `uniform float uTime;varying vec3 vDir;${GLSL_NOISE}
    void main(){
      vec3 d=normalize(vDir);
      float n1=fbm(d*2.4+vec3(0.,uTime*.004,0.));
      float n2=fbm(d*5.+n1*1.5+vec3(7.,3.,uTime*.006));
      vec3 base=mix(vec3(.002,.004,.012),vec3(.006,.014,.035),smoothstep(-.6,.8,d.y)*.7+.3*n1);
      vec3 c=base;
      c+=vec3(.008,.04,.06)*smoothstep(.45,.9,n1*.8+n2*.5)*smoothstep(.3,.9,n2);
      c+=vec3(.07,.04,.008)*pow(smoothstep(.55,1.,n1+n2*.3),2.)*.8;
      float band=exp(-pow(dot(d,normalize(vec3(.3,.9,-.3)))*3.2,2.));
      c+=vec3(.02,.03,.05)*band*(.4+n2);
      gl_FragColor=vec4(c,1.);
    }`
  }));
  m.renderOrder = -10;
  return m;
}

function buildStars(rnd) {
  const n = Q.stars, pos = new Float32Array(n * 3), col = new Float32Array(n * 3), siz = new Float32Array(n), ph = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const u = rnd() * 2 - 1, a = rnd() * TAU, s = Math.sqrt(1 - u * u), R = 500 + rnd() * 400;
    pos.set([s * Math.cos(a) * R, u * R, s * Math.sin(a) * R], i * 3);
    const t = rnd();
    const c = t < .6 ? [.75, .86, 1] : t < .85 ? [1, .9, .7] : [.6, 1, 1];
    col.set(c, i * 3);
    siz[i] = 1 + Math.pow(rnd(), 6) * 5.5;
    ph[i] = rnd() * TAU;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
  g.setAttribute('aPh', new THREE.BufferAttribute(ph, 1));
  const p = new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    uniforms: {uTime: U.uTime, uPR: U.uPR},
    vertexShader: `uniform float uTime,uPR;attribute vec3 aCol;attribute float aSize,aPh;varying vec3 vC;
      void main(){float tw=.65+.35*sin(uTime*(.6+aPh*.3)+aPh*10.);
      gl_PointSize=aSize*uPR*(.8+tw*.4);vC=aCol*tw*(.7+aSize*.35);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader: 'varying vec3 vC;void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,0.,d);a*=a;gl_FragColor=vec4(vC*1.8,a);}'
  }));
  p.frustumCulled = false; p.renderOrder = -9;
  return p;
}

function buildDust(rnd) {
  const n = Q.dust, pos = new Float32Array(n * 3), dat = new Float32Array(n * 4), col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 3 + Math.pow(rnd(), .75) * 40, a = rnd() * TAU, u = rnd() * 2 - 1;
    const s = Math.sqrt(1 - u * u);
    pos.set([Math.cos(a) * s * r, Math.max(-6.4, u * r * .42), Math.sin(a) * s * r], i * 3);
    dat.set([1.2 + rnd() * 3, rnd() * 10, .5 + rnd() * 2.2, .4 + rnd()], i * 4);
    const gold = rnd() < .55;
    col.set(gold ? [1, .78, .42] : [.45, .9, 1], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aData', new THREE.BufferAttribute(dat, 4));
  g.setAttribute('aCol', new THREE.BufferAttribute(col, 3));
  const p = new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    uniforms: {uTime: U.uTime, uPR: U.uPR, uCharge: U.uCharge, uIntro: U.uIntro},
    vertexShader: `uniform float uTime,uPR,uCharge,uIntro;attribute vec4 aData;attribute vec3 aCol;varying vec3 vC;varying float vA;
      void main(){float t=uTime*aData.w;
      vec3 p=position+vec3(sin(t*.31+aData.y*6.),sin(t*.23+aData.y*11.)*.6,cos(t*.27+aData.y*9.))*aData.z;
      float sw=uTime*.02*(1.+uCharge*3.)/(.4+length(p.xz)*.08);float cs=cos(sw),sn=sin(sw);p.xz=mat2(cs,-sn,sn,cs)*p.xz;
      vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;float dist=-mv.z;
      gl_PointSize=clamp(aData.x*uPR*(38./max(dist,1.)),1.,12.*uPR)*uIntro;

  const g = c.getContext('2d');

  const cells = 32, cw = w / cells;

    if (rnd() < .14) continue;
    const cx = i * cw + cw / 2, gw = cw * .42, gh = h * .56;
    const pts = [];
    for (let a = 0; a < 3; a++) for (let b = 0; b < 4; b++) pts.push([cx - gw / 2 + a * gw / 2, h / 2 - gh / 2 + b * gh / 3]);
    const strokes = 2 + Math.floor(rnd() * 4);
    for (let s = 0; s < strokes; s++) {
      const t = rnd();
      const p1 = pts[Math.floor(rnd() * pts.length)], p2 = pts[Math.floor(rnd() * pts.length)];
      g.beginPath();
      if (t < .55) { g.moveTo(...p1); g.lineTo(...p2); }

  const t = canvasTex(c); t.wrapS = THREE.RepeatWrapping;

}

function ramp(stops, t) {
  t = clamp(t, 0, 1);
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {

      return [lerp(a[1][0], b[1][0], k), lerp(a[1][1], b[1][1], k), lerp(a[1][2], b[1][2], k)];
    }
  }
  return stops[stops.length - 1][1];

// Seam-free equirect maps sampled from 3D noise on the sphere
function planetMaps(kind, noise, w = 512, h = 256) {

  const C = mk(), B = mk(), Em = kind === 'lava' ? mk() : null;

  const LAND = [[0, rgb(0xc2aa70)], [.25, rgb(0x3d7040)], [.6, rgb(0x6b6250)], [1, rgb(0xe6e6e6)]];
  const CRUST = [[0, rgb(0x0a0706)], [1, rgb(0x33221a)]];
  const METAL = [[0, rgb(0x8b857a)], [.5, rgb(0xd8b866)], [1, rgb(0xf6e6b4)]];
  for (let y = 0; y < h; y++) {
    const lat = (.5 - y / (h - 1)) * Math.PI, cl = Math.cos(lat), sl = Math.sin(lat);
    for (let x = 0; x < w; x++) {

        const turb = noise.fbm(dx * 3, dy * 14, dz * 3, 4);
        const bands = Math.sin((t + warp) * Math.PI * 11 + turb * 2.2) * .5 + .5;
        const v = clamp(bands * .75 + turb * .6 + .12, 0, 1);
        col = ramp(GAS, v); hg = v;
      } else if (kind === 'ocean') {
        const hh = noise.fbm(dx * 1.8 + 9, dy * 1.8, dz * 1.8, 5);
        if (hh < .02) { col = mix3(rgb(0x030c26), rgb(0x1a6a9a), clamp((hh + .25) / .27, 0, 1)); hg = .3; }
        else { const e = clamp((hh - .02) / .3, 0, 1); col = ramp(LAND, e); hg = .4 + e * .6; }
        const pol = smooth(1.05, 1.3, Math.abs(lat) + noise(dx * 4, dy * 4, dz * 4) * .12);
        col = mix3(col, rgb(0xecf6ff), pol);
      } else if (kind === 'lava') {

        const gl = smooth(.7, .95, r);
        col = ramp(CRUST, n);
        em = [gl * 1.0 + smooth(.5, .8, r) * .12, gl * .38, gl * .05];
        col = [col[0] + em[0] * .5, col[1] + em[1] * .4, col[2]];
        hg = 1 - gl * .6;
      } else {
        const st = Math.sin(lat * 46 + noise.fbm(dx * 2, dy * 2, dz * 2, 3) * 6) * .5 + .5;
        col = ramp(METAL, st * .8 + noise.fbm(dx * 5, dy * 5, dz * 5, 3) * .4); hg = st;
      }
      const o = (y * w + x) * 4;
      C.img.data[o] = clamp(col[0], 0, 1) * 255; C.img.data[o + 1] = clamp(col[1], 0, 1) * 255; C.img.data[o + 2] = clamp(col[2], 0, 1) * 255; C.img.data[o + 3] = 255;
      const bv = clamp(hg, 0, 1) * 255;
      B.img.data[o] = B.img.data[o + 1] = B.img.data[o + 2] = bv; B.img.data[o + 3] = 255;
      if (Em) { Em.img.data[o] = clamp(em[0], 0, 1) * 255; Em.img.data[o + 1] = clamp(em[1], 0, 1) * 255; Em.img.data[o + 2] = clamp(em[2], 0, 1) * 255; Em.img.data[o + 3] = 255; }
    }
  }
  C.g.putImageData(C.img, 0, 0); B.g.putImageData(B.img, 0, 0); if (Em) Em.g.putImageData(Em.img, 0, 0);
  return {color: canvasTex(C.c), bump: canvasTex(B.c, false), emissive: Em ? canvasTex(Em.c) : null};
}

function cloudMap(noise, w = 512, h = 256) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), img = g.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    const lat = (.5 - y / (h - 1)) * Math.PI, cl = Math.cos(lat), sl = Math.sin(lat);
    for (let x = 0; x < w; x++) {
      const lon = x / w * TAU;
      const n = noise.fbm(cl * Math.cos(lon) * 2.6 + 20, sl * 2.6 + 4 * Math.sin(lat * 3), cl * Math.sin(lon) * 2.6, 5);
      const a = smooth(.02, .3, n) * 255, o = (y * w + x) * 4;
      img.data[o] = img.data[o + 1] = img.data[o + 2] = 255; img.data[o + 3] = a;
    }

  g.putImageData(img, 0, 0);
  return canvasTex(c);
}

function atmosphere(r, color, power = 2.2, k = 1.5) {

    uniforms: {uC: {value: new THREE.Color(color)}, uI: {value: k}, uP: {value: power}},

    fragmentShader: 'uniform vec3 uC;uniform float uI,uP;varying vec3 vN,vV;void main(){float f=pow(clamp(-dot(vN,vV),0.,1.),uP);gl_FragColor=vec4(uC*f*uI,f*uI);}',
    side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false

function buildPlanetBody(def, noise, rnd) {
  const g = new THREE.Group(); const r = def.r; let mesh; const extras = {};
  if (def.kind === 'rock') {
    let geo = new THREE.IcosahedronGeometry(r, 24);
    geo.deleteAttribute('normal'); geo.deleteAttribute('uv');
    geo = mergeVertices(geo, 1e-4);
    const pa = geo.attributes.position, v = new THREE.Vector3(), cols = new Float32Array(pa.count * 3);
    const RK = [[0, rgb(0x2a1c10)], [.4, rgb(0x7a5a2c)], [.75, rgb(0xd9a94c)], [1, rgb(0xffe3a0)]];
    for (let i = 0; i < pa.count; i++) {
      v.fromBufferAttribute(pa, i).normalize();
      const n = noise.fbm(v.x * 1.8 + 2, v.y * 1.8, v.z * 1.8, 4);
      const rg = 1 - Math.abs(noise(v.x * 5, v.y * 5, v.z * 5));
      const h = n + rg * .12;
      v.multiplyScalar(r * (1 + .17 * n + .05 * rg));
      pa.setXYZ(i, v.x, v.y, v.z);
      const c = ramp(RK, h * 1.5 + .45); cols.set(c, i * 3);
    }
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    geo.computeVertexNormals();
    mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors: true, roughness: .82, metalness: .2, envMapIntensity: .9}));
  } else if (def.kind === 'ice') {
    const geo = new THREE.IcosahedronGeometry(r, 1);
    const pa = geo.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i < pa.count; i++) {
      v.fromBufferAttribute(pa, i); const l = v.length(); v.normalize();
      v.multiplyScalar(l * (1 + .28 * noise(v.x * 2.4 + 5, v.y * 2.4, v.z * 2.4)));
      pa.setXYZ(i, v.x, v.y * 1.15, v.z);
    }
    geo.computeVertexNormals();
    mesh = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({
      color: 0xc4ecff, roughness: .06, metalness: 0, transmission: .9, thickness: 1.1, ior: 1.45, iridescence: 1, iridescenceIOR: 1.3,
      clearcoat: 1, envMapIntensity: 1.7, attenuationColor: new THREE.Color(0x77ccff), attenuationDistance: 1.6
    }));
    const glow = new THREE.Mesh(new THREE.IcosahedronGeometry(r * .32, 1), new THREE.MeshBasicMaterial({color: new THREE.Color(.5, 1.6, 2.2), fog: false}));
    g.add(glow);

    if (def.kind === 'lava') { mat.emissiveMap = maps.emissive; mat.emissive = new THREE.Color(1, 1, 1); mat.emissiveIntensity = 2.6; mat.roughness = .9; }

    mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 96, 48), mat);
    if (def.kind === 'ocean') {
      const cl = new THREE.Mesh(new THREE.SphereGeometry(r * 1.025, 64, 32), new THREE.MeshStandardMaterial({map: cloudMap(noise), transparent: true, depthWrite: false, roughness: 1}));
      extras.clouds = cl; g.add(cl);
    }
    if (def.kind === 'gas') {
      const c = document.createElement('canvas'); c.width = 256; c.height = 4;
      const cg = c.getContext('2d'), gr = cg.createLinearGradient(0, 0, 256, 0);
      [[0, 'rgba(255,240,210,0)'], [.08, 'rgba(255,236,196,.55)'], [.2, 'rgba(210,190,150,.2)'], [.3, 'rgba(255,240,210,.7)'], [.42, 'rgba(160,190,210,.25)'],
        [.55, 'rgba(255,245,225,.6)'], [.75, 'rgba(230,210,170,.3)'], [.92, 'rgba(255,240,210,.35)'], [1, 'rgba(255,240,210,0)']].forEach(([p, col]) => gr.addColorStop(p, col));
      cg.fillStyle = gr; cg.fillRect(0, 0, 256, 4);

}

function buildPlanets(seed) {
  const rnd = mulberry32(seed + 99), noise = makeNoise(seed * 3 + 5);
  const root = new THREE.Group();
  const list = [];
  DEFS.forEach((def, i) => {
    const orbit = new THREE.Group();
    orbit.rotation.set(def.inc, def.node, 0);
    const q = new THREE.Quaternion().setFromEuler(orbit.rotation);
    const pts = [];
    for (let k = 0; k < 256; k++) { const a = k / 256 * TAU; pts.push(new THREE.Vector3(Math.cos(a) * def.a, 0, Math.sin(a) * def.a * (1 - def.ecc))); }
    const line = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color: new THREE.Color(def.atmo).lerp(new THREE.Color(0x88ccff), .4), transparent: true, opacity: .16, depthWrite: false, fog: false}));
    orbit.add(line);
    const holder = new THREE.Group(); orbit.add(holder);
    const body = buildPlanetBody(def, noise, rnd);
    const bodyWrap = new THREE.Group(); bodyWrap.add(body.group); holder.add(bodyWrap);
    const hit = new THREE.Mesh(new THREE.SphereGeometry(def.r * 1.4, 12, 8), new THREE.MeshBasicMaterial({visible: false}));
    hit.userData.i = i; holder.add(hit);
    const w = 4.2 * Math.pow(def.a, -1.5);
    list.push({i, def, orbit, q, line, holder, bodyWrap, body, hit, angle: rnd() * TAU, w, hs: 1, frozen: false, world: new THREE.Vector3(), react: 0});
    root.add(orbit);
  });
  return {root, list};
}

  const mesh = new THREE.Mesh(new THREE.CircleGeometry(21, 96), mat);
  mesh.rotation.x = -Math.PI / 2; mesh.position.y = FLOOR_Y; mesh.receiveShadow = true;

function buildShafts(dir) {
  const grp = new THREE.Group();
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
    uniforms: {uTime: U.uTime, uCharge: U.uCharge, uK: {value: 1}},
    vertexShader: 'varying vec3 vN,vV;varying vec2 vUv;varying float vD;void main(){vUv=uv;vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=normalize(-mv.xyz);vD=-mv.z;gl_Position=projectionMatrix*mv;}',
    fragmentShader: `uniform float uTime,uCharge,uK;varying vec3 vN,vV;varying vec2 vUv;varying float vD;${GLSL_NOISE}
      void main(){float e=pow(abs(dot(normalize(vN),normalize(vV))),1.6);
      float fade=smoothstep(0.,.25,vUv.y)*smoothstep(1.,.35,vUv.y)*smoothstep(12.,30.,vD);
      float n=fbm(vec3(vUv.x*6.,vUv.y*2.-uTime*.06,uTime*.05));
      vec3 c=mix(vec3(.35,.7,1.),vec3(1.,.8,.5),vUv.y)*(.03+.035*n)*(1.+uCharge*.8)*uK;
      gl_FragColor=vec4(c*e*fade*2.,e*fade*.5);}`
  });
  const q = new THREE.Quaternion().setFromUnitVectors(Y_AXIS, dir);
  [[0, 1, 1], [.07, .55, .8], [-.06, .7, .6]].forEach(([tilt, wS, k], i) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(.8 * wS, 7 * wS, 36, 40, 1, true), mat);
    m.position.copy(dir).multiplyScalar(11);
    m.quaternion.copy(q).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), tilt * (i ? 1 : 0)));
    m.renderOrder = 1; grp.add(m);

  return grp;
}

function buildShock() {
  const uni = {uK: {value: 0}};
  const vs = 'varying vec3 vN,vV;varying vec2 vUv;void main(){vUv=uv;vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}';
  const shellMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false, uniforms: uni, vertexShader: vs,
    fragmentShader: 'uniform float uK;varying vec3 vN,vV;void main(){float f=pow(1.-abs(dot(normalize(vN),normalize(vV))),3.);vec3 c=mix(vec3(1.6,1.1,.5),vec3(.4,1.3,1.8),uK);float a=f*pow(1.-uK,1.6);gl_FragColor=vec4(c*a*1.1,a*.8);}'
  });

    fragmentShader: 'uniform float uK;varying vec2 vUv;void main(){float a=pow(1.-uK,2.);vec3 c=mix(vec3(1.8,1.3,.6),vec3(.5,1.5,2.),uK);gl_FragColor=vec4(c*a*1.1,a*.8);}'

/* ====================================================================

function tCurve(t) {

}
const TRANSFORM_LEN = 10.6;

function updateTransform(dt) {
  const T = transform;
  if (T.active) {
    T.t += dt;
    const t = T.t;
    fx.expand = tCurve(t);
    fx.push = Math.max(0, tCurve(t - .5));
    fx.pulse = t < 1.2 ? smooth(0, 1.2, t) * .35 * (.5 + .5 * Math.sin(t * t * 16))

    fx.flash = t > 1.2 ? Math.min(1, smooth(1.2, 1.32, t) * Math.exp(-Math.max(0, t - 1.32) * 3.2)) : 0;
    const pull = smooth(1.4, 5, t) * (1 - smooth(6.5, 10.4, t));
    const ratio = (1 + .55 * pull) / (1 + .55 * (T.pullPrev || 0));
    if (Math.abs(ratio - 1) > 1e-6) {
      const off = camera.position.clone().sub(controls.target).multiplyScalar(ratio);
      camera.position.copy(controls.target).add(off);
    }
    T.pullPrev = pull;
    state.charge = Math.max(state.charge, smooth(0, 1.3, t));
    if (!T.ev1 && t >= 1.2) {
      T.ev1 = true;
      relicBurst.trigger(new THREE.Vector3(0, relic.group.position.y, 0), 0xffc45a, 0x66e6ff, 1);
      shock.age = 0; shock.group.visible = true;
      pingBurst.trigger(new THREE.Vector3(), 0xffffff, 0x66e6ff, 1.4);
    }
    if (!T.ev2 && t >= 2.2) {

/* ====================================================================
   Main loop
   ==================================================================== */
const clock = new THREE.Clock();
const perf = {ema: 16.7, acc: 0, cool: 3};
let frameCount = 0;

function frame() {
  const now = performance.now();
  const rdt = Math.min(clock.getDelta(), .05);

  // adaptive resolution: shed pixels if the device is struggling

  }

  if (state.timeScale < .001) state.timeScale = 0;
  const dt = rdt * state.timeScale;
  state.t += dt;
  U.uTime.value = state.t;

  updateTweens(rdt);
  if (relic) {
    updateTransform(dt);
    updateRelic(dt, state.t);
    updatePlanets(dt, rdt, state.t);
    updateLights(state.t);
  }
  U.uIntro.value = smooth(0, .35, state.assemble);
  relicBurst.update(dt); pingBurst.update(dt);
  nebula.rotation.y += dt * .002;

  // hover
  if (!pt.down && frameCount % 2 === 0 && ndc.x > -2 && pt.type === 'mouse' && !busy) {
    const h = pick();
    hovered = h && h.type === 'planet' ? h.index : null;
    canvas.style.cursor = h && h.type !== undefined ? 'pointer' : 'default';
    if (h && (h.type === 'planet' || h.type === 'relic')) {
      tip.textContent = h.type === 'planet' ? DEFS[h.index].name : 'The Relic · double-click to awaken';
      tip.classList.add('on');
    } else tip.classList.remove('on');
  } else if (ndc.x < -2) hovered = null;

  // idle drift: slow orbit + gentle tilt sway
  const idle = now - state.lastInput > 5000 && selected === null && !pt.down;
  state.idleAmt += ((idle ? 1 : 0) - state.idleAmt) * (1 - Math.exp(-rdt * .8));
  controls.autoRotate = state.idleAmt > .02;
  controls.autoRotateSpeed = .45 * state.idleAmt;
  if (state.idleAmt > .02) {

    const off = camera.position.clone().sub(controls.target).applyAxisAngle(_r, Math.sin(state.t * .13) * .00035 * state.idleAmt);

}

function applySize() {

  composer.setPixelRatio(pixelRatio); composer.setSize(w, h);

}
addEventListener('resize', applySize);
addEventListener('orientationchange', () => setTimeout(applySize, 200));

  clock.getDelta();
  renderer.setAnimationLoop(frame);

}
